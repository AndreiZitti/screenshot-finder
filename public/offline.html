<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>z-stash — Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f9fafb;
        color: #111827;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin-bottom: 0.5rem;
        font-size: 1.75rem;
      }
      p {
        color: #4b5563;
        line-height: 1.5;
      }
      button {
        min-height: 44px;
        margin-top: 1rem;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.75rem 1rem;
        background: #111827;
        color: white;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        Previously opened screens and locally saved captures remain available. Reconnect to analyze
        and sync new items.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
